<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WDD 131 – Place Project – Carlos Ornelas</title>

<meta name="description"
content="WDD 131 Dynamic Web Fundamentals Place Project Carlos Ornelas Mexico">

<meta name="author" content="Carlos Ornelas">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/place.css">

<script src="scripts/place.js" defer></script>

</head>

<body>

<header>

<h1>Mexico</h1>

</header>

<!-- HERO -->

<div class="hero">

<picture>

<source srcset="images/hero-large.webp"
media="(min-width:700px)">

<img src="images/hero-small.webp"
alt="Mexico landscape"
loading="lazy">

</picture>

</div>

<main>

<section class="card data">

<h2>Data</h2>

<p><strong>Area:</strong> 1,964,375 km²</p>

<p><strong>Population:</strong> 126 Million</p>

<p><strong>Capital:</strong> Mexico City</p>

<p><strong>Language:</strong> Spanish</p>

<p><strong>Currency:</strong> Peso</p>

<p><strong>Time Zone:</strong> UTC-6</p>

<p><strong>Calling Code:</strong> +52</p>

<p><strong>Internet TLD:</strong> .mx</p>

</section>

<section class="card weather">

<h2>Weather</h2>

<img src="images/weather.svg"
alt="weather icon"
class="weather-icon">

<p><strong>Temperature:</strong>
<span id="temp">8</span> °C</p>

<p><strong>Wind Speed:</strong>
<span id="speed">10</span> km/h</p>

<p><strong>Wind Chill:</strong>
<span id="windchill"></span></p>

</section>

</main>

<footer>

<p>
© <span id="currentyear"></span>
Carlos Ornelas | Mexico
</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
